<text x="600" y="335" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">TRIPROBOTS + эксперт заказчика</text>
<text x="600" y="375" text-anchor="middle" fill="#c8d3e5" font-size="18">Процесс · метрики · база знаний · пилот</text>
