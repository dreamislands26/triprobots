<text x="58" y="108" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="18">Постоянная команда ведёт проект от аудита до масштабирования</text>
<g stroke="#4d7cff" stroke-width="3" fill="none" opacity=".9">
