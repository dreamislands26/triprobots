<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Состав команды проекта внедрения ИИ-агента</title>
<desc id="desc">В центре постоянная команда TRIPROBOTS и эксперт заказчика. Вокруг ИТ-служба, служба безопасности, поставщики 1С и CRM и общий список задач.</desc>
<rect width="1200" height="680" rx="36" fill="#07111f"/>
