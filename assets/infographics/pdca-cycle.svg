<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Цикл улучшения ИИ-агента PDCA</title>
<desc id="desc">Четыре этапа: планируем, пробуем, проверяем, масштабируем. В центре непрерывное улучшение.</desc>
<rect width="1200" height="720" rx="36" fill="#07111f"/>
<text x="58" y="72" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Каждый агент проходит цикл: план → пилот → проверка → масштаб</text>
<g font-family="Inter,Arial,sans-serif">
<circle cx="600" cy="365" r="112" fill="#10284a" stroke="#4d7cff" stroke-width="4"/>
<text x="600" y="352" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">Непрерывное</text>
<text x="600" y="385" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">улучшение</text>

<g stroke="#4d7cff" stroke-width="4" fill="none" marker-end="url(#arrow)">
<path d="M365 205 H835"/>
<path d="M970 290 V470"/>
<path d="M835 565 H365"/>
<path d="M230 470 V290"/>
</g>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4d7cff"/></marker></defs>

<g>
<rect x="80" y="135" width="310" height="145" rx="24" fill="#0d1b2e" stroke="#34445d"/>
<text x="110" y="180" fill="#8fa8ff" font-size="16" font-weight="700">1 · ПЛАНИРУЕМ</text>
<text x="110" y="218" fill="#ffffff" font-size="23" font-weight="700">Проблема и данные</text>
<text x="110" y="248" fill="#aebbd0" font-size="16">Фиксируем текущую точку</text>
<text x="110" y="270" fill="#aebbd0" font-size="16">и метрики успеха пилота</text>
</g>
<g>
<rect x="810" y="135" width="310" height="145" rx="24" fill="#0d1b2e" stroke="#34445d"/>
<text x="840" y="180" fill="#8fa8ff" font-size="16" font-weight="700">2 · ПРОБУЕМ</text>
<text x="840" y="218" fill="#ffffff" font-size="23" font-weight="700">Один процесс</text>
<text x="840" y="248" fill="#aebbd0" font-size="16">Запускаем ограниченный пилот</text>
<text x="840" y="270" fill="#aebbd0" font-size="16">и собираем первые результаты</text>
</g>
<g>
<rect x="810" y="500" width="310" height="145" rx="24" fill="#0d1b2e" stroke="#34445d"/>
<text x="840" y="545" fill="#8fa8ff" font-size="16" font-weight="700">3 · ПРОВЕРЯЕМ</text>
<text x="840" y="583" fill="#ffffff" font-size="23" font-weight="700">Сравниваем с метриками</text>
<text x="840" y="613" fill="#aebbd0" font-size="16">Разбираем ошибки, правки</text>
<text x="840" y="635" fill="#aebbd0" font-size="16">и причины сбоев</text>
</g>
<g>
<rect x="80" y="500" width="310" height="145" rx="24" fill="#0d1b2e" stroke="#34445d"/>
<text x="110" y="545" fill="#8fa8ff" font-size="16" font-weight="700">4 · МАСШТАБИРУЕМ</text>
<text x="110" y="583" fill="#ffffff" font-size="23" font-weight="700">Расширяем охват</text>
<text x="110" y="613" fill="#aebbd0" font-size="16">Если работает — масштабируем</text>
<text x="110" y="635" fill="#aebbd0" font-size="16">Если нет — правим и повторяем</text>
</g>
</g>
</svg>