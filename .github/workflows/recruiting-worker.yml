name: Deploy recruiting Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recruiting-worker.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes wrangler@4 deploy --config agents/recruiting/live/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8b2e6834bdb06716ef7241cf15c2de54
